<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Dice Roller</title>

<style>
:root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent2: #16a34a;
    --die: #f8fafc;
    --die2: #e2e8f0;
    --pip: #111827;
    --die-text: #111827;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% -10%, #334155 0%, var(--bg1) 50%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    margin: auto;
    padding: 22px 18px 25px;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title-area {
    text-align: center;
    flex: 1;
}

h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.7px;
}

.subtitle {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
}

.menu-button {
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 14px;
    background: rgba(51,65,85,.75);
    color: white;
    font-size: 23px;
    cursor: pointer;
    touch-action: manipulation;
}

.menu-spacer {
    width: 46px;
}

/* Área principal limpa */
.dice-area {
    flex: 1;
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
}

.dice-grid {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.die-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
}

.die {
    --size: min(28vw, 118px);

    width: var(--size);
    height: var(--size);
    min-width: 88px;
    min-height: 88px;
    max-width: 118px;
    max-height: 118px;

    border: 0;
    border-radius: 21%;
    padding: 14%;
    position: relative;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    background: linear-gradient(145deg, var(--die) 0%, var(--die) 55%, var(--die2) 100%);
    box-shadow:
        0 9px 0 rgba(0,0,0,.16),
        0 17px 27px rgba(0,0,0,.40),
        inset 2px 2px 5px rgba(255,255,255,.48),
        inset -4px -4px 8px rgba(0,0,0,.10);

    cursor: pointer;
    touch-action: manipulation;
    transform-style: preserve-3d;
    user-select: none;
    transition: transform .12s ease;
}

.die:active {
    transform: translateY(5px) scale(.96);
}

.die.rolling {
    animation: physicalRoll .68s cubic-bezier(.25,.7,.35,1) infinite;
}

@keyframes physicalRoll {
    0% {
        transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
    }
    20% {
        transform: translateY(-20px) rotateX(74deg) rotateY(51deg) rotateZ(25deg) scale(1.05);
    }
    45% {
        transform: translateY(-7px) rotateX(158deg) rotateY(117deg) rotateZ(-36deg) scale(.98);
    }
    68% {
        transform: translateY(-17px) rotateX(241deg) rotateY(201deg) rotateZ(47deg) scale(1.05);
    }
    86% {
        transform: translateY(-3px) rotateX(323deg) rotateY(278deg) rotateZ(-15deg) scale(.99);
    }
    100% {
        transform: translateY(0) rotateX(360deg) rotateY(360deg) rotateZ(0deg) scale(1);
    }
}

.die.land {
    animation: land .28s ease-out;
}

@keyframes land {
    0% { transform: translateY(-10px) scale(1.07); }
    55% { transform: translateY(4px) scale(.95); }
    100% { transform: translateY(0) scale(1); }
}

.pip {
    width: 22%;
    aspect-ratio: 1;
    min-width: 7px;
    justify-self: center;
    align-self: center;
    border-radius: 50%;
    background: var(--pip);
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,.12),
        1px 2px 2px rgba(0,0,0,.35);
    opacity: 0;
}

.pip.show {
    opacity: 1;
}

.other-die-number {
    grid-column: 1 / 4;
    grid-row: 1 / 4;
    align-self: center;
    justify-self: center;
    color: var(--die-text);
    font-weight: 950;
    line-height: .9;
    letter-spacing: -2px;
    /* Bem maior que na versão anterior */
    font-size: clamp(38px, 11vw, 65px);
}

.die-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
}

.result {
    text-align: center;
    min-height: 67px;
}

.result-number {
    font-size: 40px;
    line-height: 1;
    font-weight: 950;
    letter-spacing: -1px;
}

.total {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

.roll-button {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    color: #052e16;
    font-size: 18px;
    font-weight: 950;
    box-shadow: 0 9px 22px rgba(34,197,94,.24);
    cursor: pointer;
    touch-action: manipulation;
}

.roll-button:active {
    transform: translateY(2px);
}

.roll-button:disabled {
    opacity: .72;
}

/* Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.48);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
    z-index: 20;
}

.overlay.open {
    opacity: 1;
    pointer-events: auto;
}

/* Barra lateral */
.sidebar {
    position: fixed;
    z-index: 30;
    top: 0;
    right: 0;
    width: min(340px, 88vw);
    height: 100vh;
    background: #172033;
    border-left: 1px solid rgba(255,255,255,.08);
    box-shadow: -15px 0 45px rgba(0,0,0,.35);
    transform: translateX(105%);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    padding: 20px 17px 30px;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.sidebar-title {
    font-size: 20px;
    font-weight: 900;
}

.close-button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 12px;
    background: #334155;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.setting {
    background: rgba(51,65,85,.48);
    border-radius: 16px;
    padding: 13px;
    margin-bottom: 12px;
}

.setting-title {
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    margin-bottom: 9px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.options {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.option {
    min-width: 44px;
    height: 39px;
    padding: 0 9px;
    border: 0;
    border-radius: 11px;
    background: #475569;
    color: white;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.option.active {
    background: var(--accent);
    color: #052e16;
}

.color-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.color-option {
    height: 43px;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
}

.color-option.active {
    border-color: white;
    box-shadow: 0 0 0 2px rgba(255,255,255,.2);
}

.color-option.active::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 19px;
    font-weight: 900;
    text-shadow: 0 1px 3px #000;
}

/* Cores */
.color-white  { background: linear-gradient(145deg,#fff,#dbe4ee); }
.color-red    { background: linear-gradient(145deg,#ef4444,#b91c1c); }
.color-blue   { background: linear-gradient(145deg,#60a5fa,#2563eb); }
.color-yellow { background: linear-gradient(145deg,#fde047,#ca8a04); }
.color-black  { background: linear-gradient(145deg,#475569,#0f172a); }
.color-purple { background: linear-gradient(145deg,#c084fc,#7e22ce); }

.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.toggle-text {
    font-size: 14px;
    font-weight: 700;
}

.toggle {
    width: 51px;
    height: 29px;
    border-radius: 20px;
    border: 0;
    background: #475569;
    padding: 3px;
    cursor: pointer;
}

.toggle::after {
    content: "";
    display: block;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: white;
    transition: transform .2s ease;
}

.toggle.on {
    background: var(--accent);
}

.toggle.on::after {
    transform: translateX(22px);
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 230px;
    overflow-y: auto;
}

.history-item {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: rgba(15,23,42,.42);
    border-radius: 10px;
    padding: 8px 9px;
    font-size: 12px;
}

.history-values {
    color: #cbd5e1;
}

.history-total {
    font-weight: 900;
}

.empty-history {
    color: #64748b;
    font-size: 12px;
}

.clear-history {
    width: 100%;
    height: 36px;
    margin-top: 9px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    background: transparent;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
}

@media (min-width: 430px) {
    .die {
        --size: 112px;
    }
}
</style>

  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="menu-spacer"></div>

        <div class="title-area">
            <h1>🎲 Dice Roller</h1>
            <p class="subtitle">Toque nos dados para rolar</p>
        </div>

        <button id="menuButton" class="menu-button" aria-label="Abrir configurações">☰</button>
    </div>

    <main class="dice-area">
        <div id="diceGrid" class="dice-grid"></div>
    </main>

    <section class="result">
        <div id="resultNumber" class="result-number">—</div>
        <div id="totalText" class="total">Toque no dado para começar</div>
    </section>

    <div style="height:15px"></div>

    <button id="rollButton" class="roll-button">ROLAR 🎲</button>
</div>

<div id="overlay" class="overlay"></div>

<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <div class="sidebar-title">Configurações</div>
        <button id="closeButton" class="close-button">×</button>
    </div>

    <section class="setting">
        <div class="setting-title">Quantidade de dados</div>
        <div class="options" id="countOptions">
            <button class="option active" data-count="1">1 dado</button>
            <button class="option" data-count="2">2 dados</button>
            <button class="option" data-count="3">3 dados</button>
        </div>
    </section>

    <section class="setting">
        <div class="setting-title">Tipo de dado</div>
        <div class="options" id="typeOptions">
            <button class="option active" data-sides="6">D6</button>
            <button class="option" data-sides="4">D4</button>
            <button class="option" data-sides="8">D8</button>
            <button class="option" data-sides="10">D10</button>
            <button class="option" data-sides="12">D12</button>
            <button class="option" data-sides="20">D20</button>
            <button class="option" data-sides="100">D100</button>
        </div>
    </section>

    <section class="setting">
        <div class="toggle-row">
            <div class="toggle-text">Vibração</div>
            <button id="vibrationToggle" class="toggle on" aria-label="Ativar ou desativar vibração"></button>
        </div>
    </section>

    <section class="setting">
        <div class="setting-title">Cor do dado</div>
        <div class="color-options">
            <button class="color-option color-white active" data-color="white" aria-label="Branco"></button>
            <button class="color-option color-red" data-color="red" aria-label="Vermelho"></button>
            <button class="color-option color-blue" data-color="blue" aria-label="Azul"></button>
            <button class="color-option color-yellow" data-color="yellow" aria-label="Amarelo"></button>
            <button class="color-option color-black" data-color="black" aria-label="Preto"></button>
            <button class="color-option color-purple" data-color="purple" aria-label="Roxo"></button>
        </div>
    </section>

    <section class="setting">
        <div class="setting-title">Histórico</div>
        <div id="historyList" class="history-list">
            <div class="empty-history">Nenhuma jogada ainda.</div>
        </div>
        <button id="clearHistory" class="clear-history">Limpar histórico</button>
    </section>


      <button id="installAppBtn" class="clear-history" style="display:none; margin-top:12px;">
        📲 Instalar no celular
      </button>

</aside>

<script>
(() => {
    const diceGrid = document.getElementById('diceGrid');
    const resultNumber = document.getElementById('resultNumber');
    const totalText = document.getElementById('totalText');
    const rollButton = document.getElementById('rollButton');

    const menuButton = document.getElementById('menuButton');
    const closeButton = document.getElementById('closeButton');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    const vibrationToggle = document.getElementById('vibrationToggle');
    const historyList = document.getElementById('historyList');
    const clearHistory = document.getElementById('clearHistory');

    let diceCount = Number(localStorage.getItem('diceCount')) || 1;
    let sides = Number(localStorage.getItem('diceSides')) || 6;
    let vibration = localStorage.getItem('diceVibration') !== 'false';
    let dieColor = localStorage.getItem('diceColor') || 'white';

    let values = Array.from({ length: diceCount }, () => 1);
    let rolling = false;
    let history = [];

    const faces = {
        1: [[2,2]],
        2: [[1,1],[3,3]],
        3: [[1,1],[2,2],[3,3]],
        4: [[1,1],[1,3],[3,1],[3,3]],
        5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
        6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
    };

    const colorThemes = {
        white:  { die: '#f8fafc', die2: '#dbe4ee', pip: '#111827', text: '#111827' },
        red:    { die: '#ef4444', die2: '#b91c1c', pip: '#fff',    text: '#fff' },
        blue:   { die: '#60a5fa', die2: '#2563eb', pip: '#fff',    text: '#fff' },
        yellow: { die: '#fde047', die2: '#ca8a04', pip: '#052e16', text: '#052e16' },
        black:  { die: '#475569', die2: '#0f172a', pip: '#fff',    text: '#fff' },
        purple: { die: '#c084fc', die2: '#7e22ce', pip: '#fff',    text: '#fff' }
    };

    function randomInt(min, max) {
        if (window.crypto && crypto.getRandomValues) {
            const range = max - min + 1;
            const maxUint = 0xFFFFFFFF;
            const limit = maxUint - (maxUint % range);
            const arr = new Uint32Array(1);

            do {
                crypto.getRandomValues(arr);
            } while (arr[0] >= limit);

            return min + (arr[0] % range);
        }

        return Math.floor(Math.random() * range) + min;
    }

    function applyDieColor() {
        const theme = colorThemes[dieColor];

        document.documentElement.style.setProperty('--die', theme.die);
        document.documentElement.style.setProperty('--die2', theme.die2);
        document.documentElement.style.setProperty('--pip', theme.pip);
        document.documentElement.style.setProperty('--die-text', theme.text);
    }

    function createDie(value, index) {
        const wrap = document.createElement('div');
        wrap.className = 'die-wrap';

        const die = document.createElement('button');
        die.type = 'button';
        die.className = 'die';
        die.setAttribute('aria-label', `Dado ${index + 1}: ${value}`);

        if (sides === 6) {
            for (let row = 1; row <= 3; row++) {
                for (let col = 1; col <= 3; col++) {
                    const pip = document.createElement('span');
                    pip.className = 'pip';

                    if (faces[value].some(([r,c]) => r === row && c === col)) {
                        pip.classList.add('show');
                    }

                    pip.style.gridRow = row;
                    pip.style.gridColumn = col;
                    die.appendChild(pip);
                }
            }
        } else {
            const number = document.createElement('span');
            number.className = 'other-die-number';
            number.textContent = value;
            die.appendChild(number);
        }

        die.addEventListener('click', rollAll);

        const label = document.createElement('div');
        label.className = 'die-label';
        label.textContent = `D${sides}`;

        wrap.appendChild(die);
        wrap.appendChild(label);

        return wrap;
    }

    function renderDice(rollingAnimation = false) {
        applyDieColor();
        diceGrid.innerHTML = '';

        values.forEach((value, index) => {
            diceGrid.appendChild(createDie(value, index));
        });

        if (rollingAnimation) {
            document.querySelectorAll('.die').forEach(die => {
                die.classList.add('rolling');
            });
        }
    }

    function updateResult() {
        const total = values.reduce((sum, value) => sum + value, 0);

        resultNumber.textContent = diceCount === 1 ? values[0] : total;

        if (diceCount === 1) {
            totalText.textContent = `Resultado • D${sides}`;
        } else {
            totalText.textContent = `${values.join(' + ')} = ${total}`;
        }
    }

    function addHistory() {
        const total = values.reduce((sum, value) => sum + value, 0);

        history.unshift({
            values: [...values],
            total,
            sides
        });

        history = history.slice(0, 15);
        localStorage.setItem('diceRollerHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        if (!history.length) {
            historyList.innerHTML =
                '<div class="empty-history">Nenhuma jogada ainda.</div>';
            return;
        }

        historyList.innerHTML = history.map(item => {
            const valuesText = item.values
                .map(v => `🎲 ${v}`)
                .join(' + ');

            return `
                <div class="history-item">
                    <span class="history-values">
                        ${valuesText} <small>(D${item.sides})</small>
                    </span>
                    <span class="history-total">${item.total}</span>
                </div>
            `;
        }).join('');
    }

    async function rollAll() {
        if (rolling) return;

        rolling = true;
        rollButton.disabled = true;
        rollButton.textContent = 'ROLANDO...';

        for (let i = 0; i < 8; i++) {
            values = values.map(() => randomInt(1, sides));
            renderDice(true);

            await new Promise(resolve =>
                setTimeout(resolve, 75 + i * 8)
            );
        }

        values = values.map(() => randomInt(1, sides));
        renderDice(false);

        document.querySelectorAll('.die').forEach(die => {
            die.classList.add('land');
        });

        updateResult();
        addHistory();

        if (vibration && navigator.vibrate) {
            navigator.vibrate([35, 25, 55]);
        }

        rollButton.disabled = false;
        rollButton.textContent = 'ROLAR 🎲';
        rolling = false;
    }

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('open');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
    }

    menuButton.addEventListener('click', openSidebar);
    closeButton.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeSidebar();
    });

    document.querySelectorAll('#countOptions .option').forEach(button => {
        button.addEventListener('click', () => {
            if (rolling) return;

            document.querySelectorAll('#countOptions .option')
                .forEach(b => b.classList.remove('active'));

            button.classList.add('active');

            diceCount = Number(button.dataset.count);
            localStorage.setItem('diceCount', diceCount);

            values = Array.from({ length: diceCount }, () => 1);
            renderDice();
            updateResult();
        });
    });

    document.querySelectorAll('#typeOptions .option').forEach(button => {
        button.addEventListener('click', () => {
            if (rolling) return;

            document.querySelectorAll('#typeOptions .option')
                .forEach(b => b.classList.remove('active'));

            button.classList.add('active');

            sides = Number(button.dataset.sides);
            localStorage.setItem('diceSides', sides);

            values = Array.from({ length: diceCount }, () => 1);
            renderDice();
            updateResult();
        });
    });

    document.querySelectorAll('.color-option').forEach(button => {
        button.addEventListener('click', () => {
            dieColor = button.dataset.color;
            localStorage.setItem('diceColor', dieColor);

            document.querySelectorAll('.color-option')
                .forEach(b => b.classList.remove('active'));

            button.classList.add('active');

            applyDieColor();
            renderDice();
            updateResult();
        });
    });

    vibrationToggle.addEventListener('click', () => {
        vibration = !vibration;

        vibrationToggle.classList.toggle('on', vibration);
        localStorage.setItem('diceVibration', vibration);

        if (vibration && navigator.vibrate) {
            navigator.vibrate(35);
        }
    });

    clearHistory.addEventListener('click', () => {
        history = [];
        localStorage.removeItem('diceRollerHistory');
        renderHistory();
    });

    rollButton.addEventListener('click', rollAll);

    // Recupera histórico.
    try {
        history = JSON.parse(
            localStorage.getItem('diceRollerHistory')
        ) || [];
    } catch {
        history = [];
    }

    // Marca as opções salvas.
    document.querySelectorAll('#countOptions .option').forEach(button => {
        button.classList.toggle(
            'active',
            Number(button.dataset.count) === diceCount
        );
    });

    document.querySelectorAll('#typeOptions .option').forEach(button => {
        button.classList.toggle(
            'active',
            Number(button.dataset.sides) === sides
        );
    });

    document.querySelectorAll('.color-option').forEach(button => {
        button.classList.toggle(
            'active',
            button.dataset.color === dieColor
        );
    });

    vibrationToggle.classList.toggle('on', vibration);

    renderDice();
    updateResult();
    renderHistory();
})();
</script>


<script>
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js").catch(function (err) {
        console.warn("Service Worker não registrado:", err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById("installAppBtn");

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
    if (installBtn) installBtn.style.display = "block";
  });

  if (installBtn) {
    installBtn.addEventListener("click", async function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });
  }

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    if (installBtn) installBtn.style.display = "none";
  });
})();
</script>

</body>
</html>
